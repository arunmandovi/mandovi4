# ============================
#   DATABASE CONFIG
# ============================
spring.datasource.url=jdbc:mysql://43.247.157.61:3306/mandovi
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
#   JPA / HIBERNATE CONFIG
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Show SQL queries in detail
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Auto-port for deployment (Render, Heroku, etc.)
server.port=${PORT:8080}

# ============================
#   HIKARI CONNECTION POOL
# ============================

# Keep full pool always alive
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=5

# Never close idle connections
spring.datasource.hikari.idle-timeout=0

# Keepalive ping every 30 seconds
spring.datasource.hikari.keepalive-time=30000

# Refresh connections every 25 minutes
# (Prevents MySQL killing long-lived idle sessions)
spring.datasource.hikari.max-lifetime=1500000

# Max wait time before giving timeout
spring.datasource.hikari.connection-timeout=30000

# Additional validation
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
